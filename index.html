<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>考研数学真题 · 墨题库</title>
  <meta name="description" content="1987—2026 年考研数学一 / 二 / 三真题与解析，120 套试卷 2185 题，可逐题作答并核对解析。" />
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="js/katex/katex.min.css" />
  <!-- 网络字体只作增强：非阻塞加载，取不到时回退到 --font-serif / --font-sans 里的系统宋体/黑体，
       不让 fonts.googleapis.com 不可达的访客白屏等超时。 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;600&display=swap" />
</head>
<body>
<div class="app" id="app">

  <!-- header -->
  <header class="header">
    <div class="header__brand">
      <button class="menu-btn" id="menuBtn" aria-label="展开目录" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="seal" aria-hidden="true">墨</div>
      <div>
        <div class="header__title display">考研数学真题</div>
        <div class="header__sub">1987–2026 · 2185 题全收录</div>
      </div>
    </div>
    <div class="header__right">
      <div class="header__stats meta">
        <span><strong id="statTotal">—</strong> 题</span>
        <span><strong id="statPapers">—</strong> 套卷</span>
        <span><strong id="statDone">—</strong> 本卷已批</span>
      </div>
      <button class="social-link theme-toggle" type="button" id="themeToggle" aria-label="切换到夜间模式" title="切换到夜间模式">
        <svg class="theme-icon theme-icon--moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.9 13.2A9 9 0 0 1 10.8 3.1a9 9 0 1 0 10.1 10.1Z"/></svg>
        <svg class="theme-icon theme-icon--sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="theme-label">夜间模式</span>
      </button>
      <img class="site-logo" src="assets/pondfish-logo.jpg" alt="PondFish 卡通头像" width="42" height="42" />
      <nav class="social-links" aria-label="个人主页链接">
        <a class="social-link" href="https://github.com/PondFish-me" target="_blank" rel="noopener noreferrer" aria-label="访问 PondFish-me 的 GitHub 主页">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.75.4-1.27.74-1.56-2.57-.29-5.27-1.29-5.27-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.94 10.94 0 0 1 5.75 0c2.19-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.07.79 2.16v3.21c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
          <span>GitHub</span>
        </a>
        <a class="social-link social-link--qq" href="https://qm.qq.com/q/mL0BlNOhFI" target="_blank" rel="noopener noreferrer" aria-label="添加我为 QQ 好友">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2.1c-3.25 0-5.88 2.94-5.88 6.57 0 .58.07 1.14.19 1.67-.72 1.12-1.31 2.52-1.48 3.59-.12.74.04 1.2.45 1.35.34.13.8-.04 1.29-.45.17 1.14.56 2.2 1.15 3.07-.52.2-.87.54-.87.93 0 .65.93 1.18 2.07 1.18.66 0 1.25-.18 1.63-.47.47.15.96.23 1.45.23s.98-.08 1.45-.23c.38.29.97.47 1.63.47 1.14 0 2.07-.53 2.07-1.18 0-.39-.35-.73-.87-.93.59-.87.98-1.93 1.15-3.07.49.41.95.58 1.29.45.41-.15.57-.61.45-1.35-.17-1.07-.76-2.47-1.48-3.59.12-.53.19-1.09.19-1.67C17.88 5.04 15.25 2.1 12 2.1Zm-2.15 6.36c-.48 0-.86-.53-.86-1.18s.38-1.18.86-1.18.86.53.86 1.18-.38 1.18-.86 1.18Zm4.3 0c-.48 0-.86-.53-.86-1.18s.38-1.18.86-1.18.86.53.86 1.18-.38 1.18-.86 1.18Z"/></svg>
          <span>QQ 好友</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- sidebar -->
  <aside class="sidebar" id="sidebar" aria-label="年份目录">
    <nav class="sidebar__nav">
      <button class="cat-btn active" data-cat="数学一">数学一 <span class="count"></span></button>
      <button class="cat-btn" data-cat="数学二">数学二 <span class="count"></span></button>
      <button class="cat-btn" data-cat="数学三">数学三 <span class="count"></span></button>
    </nav>
    <div class="sidebar__years" id="years"></div>
  </aside>

  <!-- main -->
  <main class="main">
    <div class="mode-bar">
      <button class="mode-tab active" data-mode="quiz">刷题模式</button>
      <button class="mode-tab" data-mode="read">纯浏览</button>
      <span class="divider" aria-hidden="true"></span>
      <span class="progress-text" id="progressText"></span>
    </div>
    <div class="tool-row" id="toolRow">
      <button class="btn btn--icon" id="prevBtn" title="上一题">‹ 上一题</button>
      <button class="btn btn--icon" id="nextBtn" title="下一题">下一题 ›</button>
      <span style="flex:1"></span>
      <button class="btn btn--primary" id="submitBtn">交卷</button>
    </div>
    <div class="canvas" id="canvas">
      <div class="canvas-inner" id="inner"></div>
    </div>
  </main>

</div>

<dialog class="score-dialog" id="scoreDialog" aria-labelledby="scoreTitle" aria-describedby="scoreSummary scoreNote">
  <section class="score-card">
    <button class="score-card__close" type="button" data-score-close aria-label="关闭成绩单">&times;</button>
    <div class="score-card__eyebrow">选择题成绩单</div>
    <div class="score-card__score"><strong id="scoreValue">0</strong><span>分</span></div>
    <h2 id="scoreTitle">批阅完成</h2>
    <p id="scoreSummary"></p>
    <p id="scoreNote">按选择题正确率折算为百分制，不含非选择题，并非考研卷面总分。</p>
    <div class="score-card__stats">
      <div><strong id="scoreCorrect">0</strong><span>答对</span></div>
      <div><strong id="scoreWrong">0</strong><span>答错</span></div>
      <div><strong id="scoreBlank">0</strong><span>未答</span></div>
    </div>
    <div class="score-card__actions">
      <button class="btn" type="button" id="retryBtn">重新作答</button>
      <button class="btn btn--primary" type="button" id="reviewBtn">查看错题</button>
    </div>
  </section>
</dialog>

<script src="js/katex/katex.min.js"></script>
<script src="js/katex/auto-render.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
